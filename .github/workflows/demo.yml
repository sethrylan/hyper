name: demo

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request number"
        required: true
        type: number

permissions:
  contents: read
  pull-requests: read

jobs:
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Get same-repository PR head
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ inputs.pr_number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          pr_json=$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}")
          head_repository=$(echo "$pr_json" | jq -r '.head.repo.full_name // empty')
          if [[ "$head_repository" != "$REPOSITORY" ]]; then
            echo "::error::Demo generation only supports pull requests from ${REPOSITORY}."
            exit 1
          fi
          head_ref=$(echo "$pr_json" | jq -r '.head.ref')
          head_sha=$(echo "$pr_json" | jq -r '.head.sha')
          echo "head_ref=$head_ref" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"

      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.CI_BOT_APP_ID }}
          private-key: ${{ secrets.CI_BOT_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v6.0.3
        with:
          ref: ${{ steps.pr.outputs.head_sha }}
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/setup-go@v6.5.0
        with:
          go-version-file: go.mod

      - name: Install VHS and demo font
        run: |
          sudo apt update
          sudo apt install -y ffmpeg fonts-jetbrains-mono ttyd
          test -f /usr/share/fonts/truetype/jetbrains-mono/JetBrainsMono-Regular.ttf
          go install github.com/charmbracelet/vhs@5262b81b590d3908a9e2d63cf06603ec0d0ae78e

      - name: Generate demo GIF
        env:
          CLICOLOR_FORCE: "1"
          COLORTERM: truecolor
          CI: ""
        run: docs/demo-setup.sh

      - name: Commit updated demo GIF
        env:
          HEAD_REF: ${{ steps.pr.outputs.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/demo.gif
          if ! git diff --cached --quiet; then
            git commit -m "chore: update demo.gif"
            git push origin "HEAD:${HEAD_REF}"
          fi

      - name: Post demo comment
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: demo
          number: ${{ inputs.pr_number }}
          recreate: true
          message: |
            ### 🎬 Demo

            ![demo](https://raw.githubusercontent.com/${{ github.repository }}/${{ steps.pr.outputs.head_ref }}/docs/demo.gif?t=${{ github.run_id }})

            Generated by [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).

            _Run `gh workflow run demo.yml -R ${{ github.repository }} -f pr_number=${{ inputs.pr_number }}` to regenerate._
